<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOUR⚡SMART — AC/DC PWR/UP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --ink: #0a0a0b;
      --steel-900: #141416;
      --steel-800: #1c1c1f;
      --steel-700: #26262a;
      --red: #d4262a;
      --gold: #e8b53a;
      --bone: #e8e6e1;
      --ash: #8a8a90;
      --panel-w: 390px;
      --tl-w: 360px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--ink);
      color: var(--bone);
      overflow: hidden;
    }

    #map {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      right: var(--tl-w);
      z-index: 0;
      background: var(--ink);
    }
    @media (max-width: 639px) {
      #map { right: 0; }
    }

    /* ── Top gradient vignette ── */
    #top-vignette {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, rgba(10,10,11,.92) 0%, transparent 100%);
      z-index: 999;
      pointer-events: none;
    }
    @media (min-width: 640px) {
      #top-vignette { right: var(--tl-w); }
    }

    /* ── Header ── */
    #header {
      position: fixed;
      top: 18px;
      left: 20px;
      z-index: 1000;
      pointer-events: none;
    }
    .wordmark {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: 0.05em;
      color: var(--bone);
      line-height: 1;
      text-transform: uppercase;
    }
    .wordmark .bolt { color: var(--red); }
    .wordmark-rule {
      height: 2px;
      background: var(--red);
      margin: 6px 0 5px;
    }
    .tagline {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--ash);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.6;
      text-align: justify;
      text-align-last: justify;
    }
    @media (max-width: 639px) {
      #header { top: 16px; left: 16px; }
      .wordmark { font-size: 19px; letter-spacing: 0.04em; }
      .wordmark-rule { margin: 4px 0 4px; }
      .tagline { font-size: 7.5px; letter-spacing: 0.14em; }
    }

    /* ── Controls ── */
    #controls-wrap {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 1000;
    }
    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    /* Burger trigger — only on mobile */
    #menu-btn {
      display: none;
      font-size: 18px;
      line-height: 1;
      width: 40px;
      height: 36px;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,11,.85);
      color: var(--bone);
      border: 1.5px solid var(--steel-700);
      border-radius: 2px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.15s, border-color 0.15s;
    }
    #menu-btn:hover { background: var(--red); border-color: var(--red); color: #fff; }
    #menu-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #menu-btn.open { background: var(--red); border-color: var(--red); color: #fff; }

    @media (min-width: 640px) {
      #controls-wrap { right: calc(var(--tl-w) + 20px); }
      #timeline-btn { display: none; }
    }
    @media (max-width: 639px) {
      #menu-btn { display: flex; margin-left: auto; }
      #controls {
        position: absolute;
        top: 44px;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        width: 188px;
        padding: 7px;
        background: rgba(20,20,22,.96);
        border: 1px solid var(--steel-700);
        border-radius: 4px;
        box-shadow: 0 12px 32px rgba(0,0,0,.6);
        backdrop-filter: blur(8px);
        transform-origin: top right;
        transition: opacity 0.16s, transform 0.16s;
        opacity: 0;
        transform: scale(0.95) translateY(-4px);
        pointer-events: none;
      }
      #controls.menu-open {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: auto;
      }
      #controls .ctrl-btn {
        text-align: left;
        padding: 11px 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
    }
    .ctrl-btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.10em;
      background: rgba(10,10,11,.85);
      color: var(--bone);
      border: 1.5px solid var(--steel-700);
      border-radius: 2px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }
    .ctrl-btn:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .ctrl-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .ctrl-btn.active { color: var(--gold); border-color: var(--gold); }
    .ctrl-btn.active:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    .fav-count {
      display: inline-block;
      background: var(--red);
      color: #fff;
      border-radius: 10px;
      font-size: 9px;
      padding: 1px 5px;
      margin-left: 5px;
      vertical-align: middle;
      font-weight: 700;
    }

    /* ── Panel base ── */
    .panel {
      position: fixed;
      z-index: 900;
      background: var(--steel-900);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.26s cubic-bezier(.4,0,.2,1);
    }
    @media (min-width: 640px) {
      .panel {
        top: 0; right: 0; bottom: 0;
        width: var(--panel-w);
        border-left: 1px solid var(--steel-700);
        transform: translateX(100%);
      }
      .panel.open { transform: translateX(0); }
    }
    @media (max-width: 639px) {
      .panel {
        left: 0; right: 0; bottom: 0;
        height: 74vh;
        border-top: 1px solid var(--steel-700);
        border-radius: 10px 10px 0 0;
        transform: translateY(100%);
      }
      .panel.open { transform: translateY(0); }
    }

    /* Red/gold accent stripe on panel top */
    .panel-stripe {
      height: 3px;
      background: var(--red);
      flex-shrink: 0;
    }
    .panel-stripe.gold { background: var(--gold); }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px 11px;
      border-bottom: 1px solid var(--steel-700);
      flex-shrink: 0;
      background: var(--steel-900);
    }
    .panel-close {
      background: none;
      border: none;
      color: var(--ash);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
      border-radius: 2px;
      font-family: 'Space Mono', monospace;
    }
    .panel-close:hover { color: var(--bone); background: var(--steel-700); }
    .panel-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--steel-700) transparent;
    }

    /* ── City panel ── */
    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--red);
      letter-spacing: 0.14em;
      font-weight: 700;
    }
    .city-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 36px;
      color: var(--bone);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .venue-line {
      font-size: 12px;
      color: var(--ash);
      margin-top: 5px;
      letter-spacing: 0.02em;
    }
    .venue-chip {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.08em;
      border: 1px solid var(--steel-700);
      border-radius: 2px;
      padding: 1px 5px;
      margin-left: 6px;
      color: var(--ash);
      vertical-align: middle;
    }
    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--red);
      text-transform: uppercase;
      margin: 18px 0 8px;
      font-weight: 700;
    }
    .show-sheet {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--steel-700);
      border: 1px solid var(--steel-700);
      border-radius: 2px;
      overflow: hidden;
    }
    .show-cell {
      background: var(--steel-800);
      padding: 9px 12px;
    }
    .show-cell.wide { grid-column: 1 / -1; }
    .show-cell-label {
      font-family: 'Space Mono', monospace;
      font-size: 7.5px;
      color: var(--ash);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .show-cell-value {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--bone);
      letter-spacing: 0.02em;
    }
    .hotel-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      background: var(--steel-800);
      border: 1px solid var(--steel-700);
      border-radius: 2px;
      border-left: 3px solid var(--steel-700);
    }
    .hotel-icon { color: var(--ash); font-size: 13px; flex-shrink: 0; margin-top: 2px; }
    .hotel-name { font-size: 13px; font-weight: 600; color: var(--bone); letter-spacing: 0.01em; }
    .hotel-addr { font-size: 11px; color: var(--ash); margin-top: 2px; }

    /* ── Guide ── */
    .guide-placeholder {
      margin-top: 8px;
      padding: 20px;
      background: var(--steel-800);
      border: 1px solid var(--steel-700);
      border-radius: 2px;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--ash);
      letter-spacing: 0.10em;
      line-height: 2;
    }
    .hotel-note {
      font-size: 12px;
      color: var(--ash);
      margin-bottom: 14px;
      padding: 9px 12px;
      background: var(--steel-800);
      border-left: 3px solid var(--gold);
      border-radius: 2px;
      line-height: 1.6;
    }
    .cat-heading {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.18em;
      color: var(--ash);
      text-transform: uppercase;
      padding: 10px 0 5px;
      border-bottom: 1px solid var(--steel-700);
      margin-bottom: 2px;
    }
    .guide-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(38,38,42,.6);
    }
    .guide-item:last-child { border-bottom: none; }
    .fav-toggle, .done-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .fav-toggle:focus-visible,
    .done-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }
    .done-toggle { font-size: 12px; }
    .guide-item-text { flex: 1; min-width: 0; }
    .guide-item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--bone);
      line-height: 1.3;
    }
    .guide-item-name a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.12s;
    }
    .guide-item-name a:hover { border-bottom-color: var(--ash); }
    .guide-item.done .guide-item-name { text-decoration: line-through; color: var(--ash); }
    .guide-item.done .guide-item-name a { pointer-events: none; }
    .guide-item-note { font-size: 11px; color: var(--ash); margin-top: 2px; line-height: 1.4; }
    .tag-chip {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 7.5px;
      letter-spacing: 0.06em;
      border-radius: 2px;
      padding: 1px 5px;
      margin-left: 5px;
      vertical-align: middle;
      font-weight: 700;
    }
    .tag-late   { background:#2a1a1a; color:#c87070; border:1px solid #4a2222; }
    .tag-dayoff { background:#1a1f2a; color:#6090c8; border:1px solid #223048; }
    .tag-walk   { background:#1a2a1a; color:#60c870; border:1px solid #224822; }

    /* ── Steel List ── */
    .steel-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--gold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .steel-actions {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--steel-700);
      flex-shrink: 0;
    }
    .steel-actions .ctrl-btn { font-size: 9px; padding: 6px 10px; }
    .steel-empty {
      padding: 40px 20px;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--ash);
      line-height: 2;
      letter-spacing: 0.06em;
    }
    .steel-city-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--bone);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 0 4px;
      border-bottom: 1px solid var(--steel-700);
      margin-bottom: 4px;
    }
    .steel-city-group { margin-bottom: 16px; }
    .steel-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
    }
    .steel-cat {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--ash);
      text-transform: uppercase;
      flex-shrink: 0;
      width: 48px;
    }
    .steel-name { flex: 1; font-size: 12px; color: var(--bone); }
    .steel-item.done .steel-name { text-decoration: line-through; color: var(--ash); }
    .steel-done {
      background: none; border: none; cursor: pointer;
      color: var(--ash); font-size: 12px; padding: 0 2px; line-height: 1;
    }
    .steel-done:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }
    .steel-remove {
      background: none; border: none; cursor: pointer;
      color: var(--steel-700); font-size: 13px; padding: 0 2px; line-height: 1;
    }
    .steel-remove:hover { color: var(--red); }
    .steel-remove:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 2px; }

    /* Glowing leading dot for the route animation */
    .ts-dot-anim {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ff4040;
      box-shadow:
        0 0 0 3px rgba(255,60,60,.35),
        0 0 10px 4px rgba(255,60,60,.65),
        0 0 24px 8px rgba(255,60,60,.3);
    }

    /* ── Leaflet overrides ── */
    .leaflet-container { background: var(--ink) !important; }
    .leaflet-control-zoom,
    .leaflet-control-attribution { display: none !important; }

    /* Markers */
    .ts-marker {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--steel-900);
      border: 2px solid #54545d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: var(--ash);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, border-color 0.15s, color 0.15s;
      user-select: none;
      letter-spacing: 0;
    }
    .ts-marker.guide {
      border-color: #54545d;
      background: var(--steel-900);
    }
    /* Active marker (clicked / animation turn) lights up to match its label */
    .ts-marker.active {
      border-color: var(--gold);
      color: var(--bone);
      box-shadow: 0 0 0 3px rgba(232,181,58,.2), 0 2px 10px rgba(0,0,0,.55);
    }
    .ts-marker:hover {
      transform: scale(1.25);
      box-shadow: 0 0 0 3px rgba(212,38,42,.25), 0 2px 12px rgba(0,0,0,.6);
      z-index: 1000 !important;
    }
    .ts-marker.guide:hover {
      box-shadow: 0 0 0 3px rgba(232,181,58,.25), 0 2px 12px rgba(0,0,0,.6);
    }

    /* Tooltip */
    .leaflet-tooltip {
      background: var(--steel-900) !important;
      border: 1px solid var(--steel-700) !important;
      color: var(--bone) !important;
      font-family: 'Space Mono', monospace !important;
      font-size: 10px !important;
      border-radius: 2px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.5) !important;
      padding: 4px 9px !important;
      letter-spacing: 0.05em !important;
    }
    .leaflet-tooltip::before { display: none !important; }

    /* Permanent city-name labels on markers — resting: light, gray, small */
    .leaflet-tooltip.ts-citylabel {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: var(--ash) !important;
      font-family: 'Space Mono', monospace !important;
      font-weight: 400 !important;
      font-size: 8px !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      padding: 0 !important;
      backdrop-filter: none !important;
      text-shadow: 0 1px 3px rgba(10,10,11,.95), 0 0 3px rgba(10,10,11,.95) !important;
      transition: color 0.15s !important;
    }
    @media (max-width: 639px) {
      .leaflet-tooltip.ts-citylabel { font-size: 7px !important; letter-spacing: 0.03em !important; }
    }

    /* Active state — clicked, or the city the animation is reaching */
    .leaflet-tooltip.ts-citylabel.active {
      background: rgba(10,10,11,.9) !important;
      border: 1.5px solid var(--gold) !important;
      color: var(--bone) !important;
      font-family: 'Oswald', sans-serif !important;
      font-weight: 700 !important;
      font-size: 12px !important;
      letter-spacing: 0.05em !important;
      padding: 3px 8px !important;
      box-shadow: 0 2px 10px rgba(232,181,58,.4), 0 2px 12px rgba(0,0,0,.6) !important;
      text-shadow: none !important;
      z-index: 1200 !important;
    }
    @media (max-width: 639px) {
      .leaflet-tooltip.ts-citylabel.active { font-size: 10px !important; padding: 2px 6px !important; }
    }

    #import-input { display: none; }

    /* ── Timeline View ── */
    /* ── Desktop: feste rechte Seitenleiste ── */
    #timeline-view {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: var(--tl-w);
      z-index: 10;
      background: var(--steel-900);
      border-left: 1px solid var(--steel-700);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #timeline-header {
      flex-shrink: 0;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--steel-700);
    }
    .tl-sidebar-title {
      font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 13px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ash);
    }
    .tl-sidebar-sub {
      font-family: 'Space Mono', monospace; font-size: 7.5px;
      letter-spacing: 0.14em; color: var(--steel-700); margin-top: 3px;
    }
    #timeline-body {
      flex: 1; overflow-y: auto; padding: 8px 14px 60px;
      scrollbar-width: thin; scrollbar-color: var(--steel-700) transparent;
    }

    /* ── Mobile: Bottom-Drawer ── */
    @media (max-width: 639px) {
      #timeline-view {
        top: auto; left: 0; right: 0; bottom: 0;
        width: 100%; border-left: none;
        border-top: 1px solid var(--steel-700);
        border-radius: 12px 12px 0 0;
        height: 62vh;
        transform: translateY(calc(100% - 48px));
        transition: transform 0.3s cubic-bezier(.4,0,.2,1);
        z-index: 200;
      }
      #timeline-view.tl-expanded { transform: translateY(0); }
      #timeline-header { display: none; }
    }

    /* ── Drawer-Handle (nur mobile) ── */
    #tl-handle {
      display: none;
      flex-shrink: 0; height: 48px; cursor: pointer;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 5px;
      background: var(--steel-900); user-select: none;
      -webkit-user-select: none;
    }
    #tl-handle-bar {
      width: 36px; height: 3px; background: var(--steel-700);
      border-radius: 2px; transition: background 0.15s;
    }
    #tl-handle:hover #tl-handle-bar { background: var(--ash); }
    #tl-handle-label {
      font-family: 'Space Mono', monospace; font-size: 7px;
      letter-spacing: 0.18em; color: var(--ash); text-transform: uppercase;
    }
    @media (max-width: 639px) { #tl-handle { display: flex; } }

    /* ── Timeline-Rows: etwas schmaler für Sidebar ── */
    #timeline-view .tl-row {
      grid-template-columns: 58px 100px 1fr;
      gap: 0 8px; padding: 5px 6px; margin: 0 -6px;
    }

      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--bone);
      padding-bottom: 7px;
      border-bottom: 2px solid var(--red);
      margin: 32px 0 4px;
    }
    .tl-month-hd:first-child { margin-top: 0; }

    .tl-week-hd {
      font-family: 'Space Mono', monospace;
      font-size: 7.5px;
      letter-spacing: 0.22em;
      color: var(--steel-700);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 2px;
    }
    .tl-week-hd::after { content:''; flex:1; height:1px; background:var(--steel-700); }

    .tl-row {
      display: grid;
      grid-template-columns: 66px 112px 1fr;
      align-items: center;
      gap: 0 10px;
      padding: 6px 8px;
      margin: 0 -8px;
      border-bottom: 1px solid rgba(38,38,42,.4);
      border-radius: 2px;
    }
    .tl-row.tl-show  { background: rgba(212,38,42,.04); }
    .tl-row.tl-link  { cursor: pointer; }
    .tl-row.tl-link:hover { background: var(--steel-800); }
    .tl-row.tl-now   { border-left: 3px solid var(--red); padding-left: 5px; margin-left: -8px; }

    .tl-date {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--bone);
      line-height: 1.3;
    }
    .tl-dow {
      font-size: 7.5px;
      letter-spacing: 0.14em;
      color: var(--ash);
      display: block;
      text-transform: uppercase;
    }

    .tl-tag {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
    }
    .tl-icon { font-size: 12px; flex-shrink: 0; }

    .tl-info { min-width: 0; }
    .tl-city {
      font-size: 12px;
      font-weight: 500;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .tl-row.tl-show .tl-city {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--red);
    }
    .tl-note {
      font-size: 10px;
      color: var(--ash);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .tl-break-block {
      margin: 12px 0;
      padding: 13px 16px;
      background: var(--steel-800);
      border: 1px solid var(--steel-700);
      border-left: 3px solid var(--steel-700);
      border-radius: 2px;
    }
    .tl-break-title {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ash);
    }
    .tl-break-sub {
      font-family: 'Space Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.10em;
      color: var(--steel-700);
      margin-top: 4px;
    }

    @media (max-width: 639px) {
      .tl-date { font-size: 9px; }
      .tl-tag  { font-size: 7.5px; }
      .tl-city { font-size: 11px; }
      .tl-row.tl-show .tl-city { font-size: 14px; }
    }

    /* ── City Panel: versteckt (durch Modal ersetzt) ── */
    #city-panel { display: none !important; }

    /* ── City Modal ── */
    #city-modal-overlay {
      position: fixed;
      inset: 0; right: var(--tl-w);
      z-index: 800; display: none;
      align-items: center; justify-content: center;
      background: rgba(10,10,11,.72);
      backdrop-filter: blur(3px);
    }
    #city-modal-overlay.modal-open { display: flex; animation: modal-bg-in 0.2s ease-out; }
    @keyframes modal-bg-in { from { opacity:0 } to { opacity:1 } }

    #city-modal {
      background: var(--steel-900);
      border: 1px solid var(--steel-700);
      border-radius: 4px;
      width: min(500px, calc(100% - 40px));
      max-height: calc(100vh - 80px);
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.75);
      animation: modal-card-in 0.24s cubic-bezier(.34,1.25,.64,1);
    }
    @keyframes modal-card-in {
      from { opacity:0; transform: scale(0.94) translateY(8px) }
      to   { opacity:1; transform: scale(1)    translateY(0)   }
    }

    .modal-stripe { height: 3px; background: var(--red); flex-shrink: 0; }
    .modal-stripe.gold { background: var(--gold); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 20px 11px; border-bottom: 1px solid var(--steel-700);
      flex-shrink: 0;
    }
    #modal-close {
      background: none; border: none; color: var(--ash);
      font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 2px;
      font-family: 'Space Mono', monospace; line-height: 1;
    }
    #modal-close:hover { color: var(--bone); background: var(--steel-700); }
    #modal-close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #modal-body {
      flex: 1; overflow-y: auto; padding: 20px;
      scrollbar-width: thin; scrollbar-color: var(--steel-700) transparent;
    }

    @media (max-width: 639px) {
      #city-modal-overlay { right: 0; align-items: flex-end; }
      #city-modal {
        width: 100%; max-height: 85vh;
        border-radius: 12px 12px 0 0; border-bottom: none;
        animation: modal-sheet-in 0.28s cubic-bezier(.4,0,.2,1);
      }
      @keyframes modal-sheet-in {
        from { opacity:0; transform: translateY(100%) }
        to   { opacity:1; transform: translateY(0)     }
      }
    }
  </style>
</head>

const FAV_KEY = 'toursmart_favs';
let favs = {};
function loadFavs() {
  try { favs = JSON.parse(localStorage.getItem(FAV_KEY) || '{}'); } catch(e) { favs = {}; }
}
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {} }
function favId(n, cat, name) { return `${n}::${cat}::${name}`; }
function toggleFav(show, cat, item) {
  const id = favId(show.n, cat, item.name);
  if (favs[id]) delete favs[id];
  else favs[id] = {id, city:show.city, cat, name:item.name, done:false};
  saveFavs(); updateFavCount();
}
function setFavDone(id, val) { if (favs[id]) { favs[id].done = val; saveFavs(); } }
function removeFav(id) { delete favs[id]; saveFavs(); updateFavCount(); renderSteelList(); }
function updateFavCount() {
  document.getElementById('fav-count').textContent = Object.keys(favs).length;
}

const map = L.map('map', {
  center:[44,-97], zoom:4,
  zoomControl:false, attributionControl:false,
  minZoom:3, maxZoom:12
});

// Fit to all show markers once DOM is ready
map.whenReady(() => {
  const bounds = L.latLngBounds(SHOWS.map(s => [s.lat, s.lng]));
  const mobile = window.innerWidth < 640;
  map.fitBounds(bounds, {padding: mobile ? [44, 36] : [60, 80]});
});

// Geo fill style — subtle dark polygons
const geoStyle = {
  fillColor: '#141416',
  fillOpacity: 1,
  color: '#2e2e34',
  weight: 0.8
};
// Slightly lighter border between US and Canada/Mexico
const borderStyle = {
  fillColor: '#141416',
  fillOpacity: 1,
  color: '#3a3a42',
  weight: 1.2
};

// Load geo layers: US states (state-level) + Canada & Mexico (country-level for context)
(async () => {
  try {
    const [usRes, worldRes] = await Promise.all([
      fetch('https://cdn.jsdelivr.net/gh/PublicaMundi/MappingAPI@master/data/geojson/us-states.json'),
      fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson')
    ]);
    // Canada + Mexico outline first (bottom layer)
    if (worldRes.ok) {
      const world = await worldRes.json();
      const context = {
        type: 'FeatureCollection',
        features: world.features.filter(f => ['CAN', 'MEX'].includes(f.id))
      };
      L.geoJSON(context, { style: geoStyle }).addTo(map).bringToBack();
    }
    // US states on top so state borders show through
    if (usRes.ok) {
      const us = await usRes.json();
      L.geoJSON(us, { style: geoStyle }).addTo(map).bringToBack();
    }
  } catch(e) {
    // Offline fallback: black canvas + markers still fully usable
  }
})();

const isMobile = window.innerWidth < 640;
const MK   = isMobile ? 16 : 32;   // marker diameter
const MFS  = isMobile ? 6 : 9;     // number font-size
const MBW  = isMobile ? 1.5 : 2;   // border width

// Spread out the crowded east-coast labels (drop a few below their marker)
const LABEL_DIR = { 1:'right', 2:'right', 4:'bottom', 6:'bottom', 10:'bottom', 12:'top', 13:'bottom', 17:'top', 18:'bottom' };
// Fine per-marker nudges [dx,dy] to clear neighbouring chips in tight spots
const LABEL_NUDGE = { 2: [0, -7], 17: [8, 0] };
function labelOffset(dir, n) {
  const d = MK/2;   // city names sit right against the chips
  let off = dir === 'bottom' ? [0, d] : dir === 'left' ? [-d, 0] : dir === 'right' ? [d, 0] : [0, -d];
  const nudge = LABEL_NUDGE[n];
  return nudge ? [off[0] + nudge[0], off[1] + nudge[1]] : off;
}

const markersByN = {};
const markerEls  = {};
SHOWS.forEach(show => {
  const el = document.createElement('div');
  el.className = 'ts-marker' + (show.hasGuide ? ' guide' : '');
  el.textContent = String(show.n).padStart(2,'0');
  el.style.width = el.style.height = MK + 'px';
  el.style.fontSize = MFS + 'px';
  el.style.borderWidth = MBW + 'px';

  const icon = L.divIcon({html:el, className:'', iconSize:[MK,MK], iconAnchor:[MK/2,MK/2]});
  const m = L.marker([show.lat, show.lng], {icon});
  const dir = LABEL_DIR[show.n] || 'top';
  m.bindTooltip(show.city.toUpperCase(), {
    permanent:true, direction:dir, offset:labelOffset(dir, show.n), opacity:1,
    className:'ts-citylabel' + (show.hasGuide ? ' guide' : '')
  });
  m.on('click', () => openCity(show));
  m.addTo(map);
  markersByN[show.n] = m;
  markerEls[show.n]  = el;
});

// ── Active city label (clicked or animation turn) ──
let clickedCityN = null;   // set by the city modal
let animCityN    = null;   // set by the route animation
function labelEl(n) {
  const tt = markersByN[n] && markersByN[n].getTooltip();
  return tt ? tt.getElement() : null;
}
function refreshActiveLabel() {
  const active = clickedCityN != null ? clickedCityN : animCityN;
  for (const k in markersByN) {
    const n = +k;
    const isActive = n === active;
    const tt = markersByN[k].getTooltip();
    const el = tt && tt.getElement();
    if (el) el.classList.toggle('active', isActive);
    if (markerEls[k]) markerEls[k].classList.toggle('active', isActive);
    if (tt) {
      // Highlight chip always pops centered above the disc; resting labels keep their per-city side
      if (isActive) {
        tt.options.direction = 'top';
        tt.options.offset = [0, -(MK / 2 + 1)];
      } else {
        const dir = LABEL_DIR[n] || 'top';
        tt.options.direction = dir;
        tt.options.offset = labelOffset(dir, n);
      }
      tt.update();  // recompute position for the new size/direction (Leaflet won't on a class toggle)
    }
  }
}

// ─────────────────────────────────────────────
//  ROUTE
// ─────────────────────────────────────────────
const coords = SHOWS.map(s => [s.lat, s.lng]);
const lineStyle = {color:'#d4262a', weight: isMobile ? 1 : 1.5, opacity:0.28};
let routeSegs = [];
let animating = false;
let routeMode = 'static';
let rafId = null;
let dotMarker = null;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function clearRoute() {
  routeSegs.forEach(l => map.removeLayer(l));
  routeSegs = [];
  animating = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  removeDot();
  animCityN = null; refreshActiveLabel();
}
function drawStatic() { clearRoute(); routeSegs.push(L.polyline(coords, lineStyle).addTo(map)); }

function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

// Glowing leading dot + gold arrival pulse (route-animation flourish)
function removeDot() { if (dotMarker) { map.removeLayer(dotMarker); dotMarker = null; } }
function createDot(latlng) {
  removeDot();
  const el = document.createElement('div');
  el.className = 'ts-dot-anim';
  const icon = L.divIcon({ html: el, className: '', iconSize: [12, 12], iconAnchor: [6, 6] });
  dotMarker = L.marker(latlng, { icon, zIndexOffset: 3000, interactive: false }).addTo(map);
}
function moveDot(latlng) { if (dotMarker) dotMarker.setLatLng(latlng); }
function pulseRing(show) {
  const ring = L.circleMarker([show.lat, show.lng], {
    radius: 9, color: '#e8b53a', weight: 2, fillOpacity: 0, opacity: 0.9, interactive: false
  }).addTo(map);
  let t0 = null;
  function anim(ts) {
    if (!t0) t0 = ts;
    const p = Math.min((ts - t0) / 500, 1);
    ring.setRadius(9 + 20 * p);
    ring.setStyle({ opacity: 0.9 * (1 - p) });
    if (p < 1) requestAnimationFrame(anim); else map.removeLayer(ring);
  }
  requestAnimationFrame(anim);
}

function drawAnimated(loop = true) {
  if (reducedMotion) { drawStatic(); return; }
  clearRoute();
  animating = true;

  const poly = L.polyline(coords, {color:'#d4262a', weight:3, opacity:0.9}).addTo(map);
  routeSegs.push(poly);

  requestAnimationFrame(() => {
    const el = poly.getElement();
    if (!el || !el.getTotalLength) { drawStatic(); return; }
    const total = el.getTotalLength();
    if (!total) { drawStatic(); return; }

    el.style.strokeDasharray  = total;
    el.style.strokeDashoffset = total;

    // Cumulative length to each city vertex (mirrors the SVG path length)
    const pts = coords.map(c => map.latLngToLayerPoint(L.latLng(c[0], c[1])));
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum[i] = cum[i-1] + pts[i].distanceTo(pts[i-1]);
    const totalLen = cum[cum.length-1] || 1;

    // Step city-by-city: each city stays highlighted for at least DWELL ms
    const DWELL = 2000;   // hold on each city 2 s
    const SEG   = 700;    // time to draw each connecting segment
    const FADE  = 900;

    let i = 0;
    let phase = 'dwell';
    let segStart = null;

    function setCity(n) { if (animCityN !== n) { animCityN = n; refreshActiveLabel(); } }
    setCity(SHOWS[0].n);
    createDot(coords[0]);
    pulseRing(SHOWS[0]);

    function step(ts) {
      if (!animating) return;
      if (segStart === null) segStart = ts;
      const elapsed = ts - segStart;

      if (phase === 'dwell') {
        el.style.opacity = 1;
        el.style.strokeDashoffset = total * (1 - cum[i] / totalLen);
        if (elapsed >= DWELL) {
          if (i >= SHOWS.length - 1) {
            if (loop) { removeDot(); phase = 'fading'; segStart = ts; }
            else { setStatic(); return; }   // one runthrough done → settle to the static route
          } else {
            phase = 'drawing'; segStart = ts;
          }
        }

      } else if (phase === 'drawing') {
        const p = Math.min(elapsed / SEG, 1);
        const eased = easeInOut(p);
        const drawn = cum[i] + (cum[i+1] - cum[i]) * eased;
        el.style.strokeDashoffset = total * (1 - drawn / totalLen);
        moveDot([
          coords[i][0] + (coords[i+1][0] - coords[i][0]) * eased,
          coords[i][1] + (coords[i+1][1] - coords[i][1]) * eased
        ]);
        if (p >= 1) { i++; setCity(SHOWS[i].n); pulseRing(SHOWS[i]); phase = 'dwell'; segStart = ts; }

      } else if (phase === 'fading') {
        const p = Math.min(elapsed / FADE, 1);
        el.style.opacity = 1 - p;
        if (p >= 1) {
          el.style.opacity = 1;
          el.style.strokeDashoffset = total;
          i = 0; phase = 'dwell'; segStart = ts;
          setCity(SHOWS[0].n);
          createDot(coords[0]);
          pulseRing(SHOWS[0]);
        }
      }
      rafId = requestAnimationFrame(step);
    }
    rafId = requestAnimationFrame(step);
  });
}

drawStatic();

function buildCityHTML(show) {
  const g = GUIDES[String(show.n)];
  return `
    <div class="city-name">${esc(show.city)}</div>
    <div class="venue-line">${esc(show.venue)}<span class="venue-chip">${show.venueType.toUpperCase()}</span></div>

    <div class="section-label">SHOW SHEET</div>
    <div class="show-sheet">
      <div class="show-cell">
        <div class="show-cell-label">DOORS</div>
        <div class="show-cell-value">${show.doors}</div>
      </div>
      <div class="show-cell">
        <div class="show-cell-label">CURFEW</div>
        <div class="show-cell-value">${show.curfew}</div>
      </div>
      <div class="show-cell wide">
        <div class="show-cell-label">THE PRETTY RECKLESS</div>
        <div class="show-cell-value">${show.prettyReckless}</div>
      </div>
      <div class="show-cell wide">

        <div class="show-cell-value">${show.acdc}</div>
      </div>

      </div>

      <span class="hotel-icon">⌂</span>
      <div>
        <div class="hotel-name">${esc(show.hotel.name)}</div>
        <div class="hotel-addr">${esc(show.hotel.address)}</div>
      </div>
    </div>

    <div class="section-label">GUIDE</div>
    ${buildGuideHTML(show, g)}
  `;
}

function buildGuideHTML(show, g) {
  if (!g || !show.hasGuide) {
    return `<div class="guide-placeholder">GUIDE TO FOLLOW<br><span style="font-size:9px;opacity:.4;letter-spacing:.12em">COMING SOON</span></div>`;
  }
  let html = '';
  if (g.hotelNote) html += `<div class="hotel-note">${esc(g.hotelNote)}</div>`;
  ['food','coffee','bars','sights','nature','dayoff'].forEach(cat => {
    const items = g[cat]; if (!items || !items.length) return;
    html += `<div><div class="cat-heading">${CAT_LABELS[cat]}</div>`;
    items.forEach(item => {
      const id = favId(show.n, cat, item.name);
      const isFav = !!favs[id];
      const isDone = favs[id]?.done || false;
      const tagHtml = item.tag ? `<span class="tag-chip tag-${item.tag}">${item.tag}</span>` : '';
      html += `
        <div class="guide-item${isDone?' done':''}" data-id="${esc(id)}">
          <button class="fav-toggle" data-n="${show.n}" data-cat="${cat}" data-name="${escAttr(item.name)}"
            aria-label="${isFav?'Remove from':'Add to'} favorites"
            style="color:${isFav?'var(--gold)':'var(--ash)'}">${isFav?'★':'☆'}</button>
          <div class="guide-item-text">
            <div class="guide-item-name"><a href="https://maps.google.com/?q=${encodeURIComponent(item.name + ', ' + show.city)}" target="_blank" rel="noopener">${esc(item.name)}</a>${tagHtml}</div>
            <div class="guide-item-note">${esc(item.note)}</div>
          </div>
          <button class="done-toggle" data-id="${esc(id)}" aria-label="Mark done"
            style="color:${isDone?'var(--gold)':'var(--steel-700)'}">✓</button>
        </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function bindItemToggles(show) {
  modalBody.querySelectorAll('.fav-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = GUIDES[btn.dataset.n][btn.dataset.cat].find(i => i.name === btn.dataset.name);
      toggleFav(SHOWS.find(s => s.n === +btn.dataset.n), btn.dataset.cat, item);
      modalBody.innerHTML = buildCityHTML(show);
      bindItemToggles(show);
    });
  });
  modalBody.querySelectorAll('.done-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const row = btn.closest('.guide-item');
      const wasDone = row.classList.contains('done');
      setFavDone(id, !wasDone);
      row.classList.toggle('done', !wasDone);
      btn.style.color = !wasDone ? 'var(--gold)' : 'var(--steel-700)';
      if (steelPanel.classList.contains('open')) renderSteelList();
    });
  });
}

function renderSteelList() {
  const ids = Object.keys(favs);
  if (!ids.length) {
    steelBody.innerHTML = `<div class="steel-empty">NO FAVORITES YET<br>☆ TAP IN A GUIDE TO ADD</div>`;
    return;
  }
  let html = '';
  SHOWS.forEach(s => {
    const group = ids.filter(id => id.startsWith(`${s.n}::`)).map(id => favs[id]);
    if (!group.length) return;
    html += `<div class="steel-city-group"><div class="steel-city-label">${esc(s.city)}</div>`;
    group.forEach(f => {
      html += `
        <div class="steel-item${f.done?' done':''}" data-id="${esc(f.id)}">
          <span class="steel-cat">${CAT_LABELS[f.cat]||f.cat}</span>
          <span class="steel-name">${esc(f.name)}</span>
          <button class="steel-done" data-id="${esc(f.id)}" aria-label="Toggle done"
            style="color:${f.done?'var(--gold)':'var(--ash)'}">✓</button>
          <button class="steel-remove" data-id="${esc(f.id)}" aria-label="Remove">✕</button>
        </div>`;
    });
    html += `</div>`;
  });
  steelBody.innerHTML = html;

  steelBody.querySelectorAll('.steel-done').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id; const wasDone = !!favs[id]?.done;
      setFavDone(id, !wasDone);
      btn.closest('.steel-item').classList.toggle('done', !wasDone);
      btn.style.color = !wasDone ? 'var(--gold)' : 'var(--ash)';
      if (activeShow) { modalBody.innerHTML = buildCityHTML(activeShow); bindItemToggles(activeShow); }
    });
  });
  steelBody.querySelectorAll('.steel-remove').forEach(btn => {
    btn.addEventListener('click', () => removeFav(btn.dataset.id));
  });
}

  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const arr = JSON.parse(ev.target.result);
      if (Array.isArray(arr)) arr.forEach(f => { if (f.id) favs[f.id] = f; });
      saveFavs(); updateFavCount(); renderSteelList();
    } catch(e) { alert('Invalid JSON file.'); }
  };
  r.readAsText(file); e.target.value = '';
});

function fmtDate(iso) {
  return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',
    {month:'short', day:'numeric', year:'numeric', timeZone:'UTC'});
}
function fmtDateLong(iso) {
  return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',
    {day:'2-digit', month:'short', year:'numeric', timeZone:'UTC'}).toUpperCase();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return esc(s); }

const TYPE_CFG = {
  'show':        {color:'var(--red)',  icon:'⚡', label:'SHOW'},
  'tech':        {color:'#5a8fc8',    icon:'⚙',  label:'TECH'},
  'load-in':     {color:'#4a7ab8',    icon:'⊟',  label:'LOAD IN'},
  'rehearsal':   {color:'#9d7cd8',    icon:'♬',  label:'REHEARSAL'},
  'travel':      {color:'var(--ash)', icon:'✈',  label:'TRAVEL'},
  'travel-home': {color:'var(--ash)', icon:'✈',  label:'TRAVEL HOME'},
  'day-off':     {color:'var(--gold)','icon':'○', label:'DAY OFF'},
  'break':       {color:'var(--ash)', icon:'—',  label:'BREAK'}
};

function fmtDayMonth(iso) {
  return new Date(iso+'T12:00:00Z')
    .toLocaleDateString('en-US', {month:'short', day:'numeric', timeZone:'UTC'})
    .toUpperCase();
}

function renderTimeline() {
  const todayStr  = new Date().toISOString().slice(0,10);
  const tourStart = new Date('2026-07-06T12:00:00Z');
  const days = ITINERARY;

  if (!days.length) {
    document.getElementById('timeline-content').innerHTML =
      '<div style="padding:60px 20px;text-align:center;font-family:\'Space Mono\',monospace;font-size:11px;color:var(--ash);letter-spacing:.10em;line-height:2">TIMELINE DATA UNAVAILABLE<br><span style="opacity:.45;font-size:9px">Start the local server · python3 -m http.server 3456</span></div>';
    return;
  }

  let html = '';
  let lastMonth = '';
  let lastWeek  = -1;
  let i = 0;

  while (i < days.length) {
    const day = days[i];

    // Collapse consecutive break days into one block
    if (day.type === 'break') {
      let j = i;
      while (j < days.length && days[j].type === 'break') j++;
      const count = j - i;
      html += `<div class="tl-break-block">
        <div class="tl-break-title">Tour Break — ${count} days at home</div>
        <div class="tl-break-sub">${fmtDayMonth(days[i].date)} – ${fmtDayMonth(days[j-1].date)}</div>
      </div>`;
      i = j;
      continue;
    }

    // Month header
    const monthKey = day.date.slice(0,7);
    if (monthKey !== lastMonth) {
      lastMonth = monthKey;
      const mn = new Date(day.date+'T12:00:00Z')
        .toLocaleDateString('en-US', {month:'long', year:'numeric', timeZone:'UTC'})
        .toUpperCase();
      html += `<div class="tl-month-hd">${mn}</div>`;
    }

    // Week separator (tour-relative, Mon-anchored)
    const dayDate  = new Date(day.date+'T12:00:00Z');
    const weekNum  = Math.floor((dayDate - tourStart) / (7 * 86400000)) + 1;
    if (weekNum !== lastWeek) {
      lastWeek = weekNum;
      html += `<div class="tl-week-hd">WEEK ${String(weekNum).padStart(2,'0')}</div>`;
    }

    // Row config
    const cfg    = TYPE_CFG[day.type] || {color:'var(--ash)', icon:'·', label:(day.type||'').toUpperCase()};
    const isShow = day.type === 'show';
    const isLink = day.stopN != null;
    const isNow  = day.date === todayStr;
    const show   = isLink ? SHOWS.find(s => s.n === day.stopN) : null;

    const d2     = new Date(day.date+'T12:00:00Z');
    const dateStr= d2.toLocaleDateString('en-US', {month:'short', day:'2-digit', timeZone:'UTC'}).toUpperCase();
    const dowStr = d2.toLocaleDateString('en-US', {weekday:'short', timeZone:'UTC'}).toUpperCase();

    let typeLabel = cfg.label;
    if (isShow && day.stopN != null) typeLabel = `SHOW ${String(day.stopN).padStart(2,'0')}`;

    let cityHtml;
    if (day.type === 'travel' || day.type === 'travel-home') {
      const f = day.from || '';
      const t = day.to   || '';
      cityHtml = esc(`${f} → ${t}`);
    } else if (day.city && day.city !== 'Home') {
      cityHtml = esc(`${day.city}${day.region ? ', ' + day.region : ''}`);
    } else {
      cityHtml = 'Home';
    }

    let noteHtml = '';
    if (isShow && show) {
      noteHtml = esc(`Doors ${show.doors} · ${show.venue}`);
    } else if (day.note && !isShow) {
      noteHtml = esc(day.note);
    }

    html += `<div class="tl-row${isShow?' tl-show':''}${isLink?' tl-link':''}${isNow?' tl-now':''}"${isLink ? ` data-stopn="${day.stopN}"` : ''}>
      <div class="tl-date">${dateStr}<span class="tl-dow">${dowStr}</span></div>
      <div class="tl-tag" style="color:${cfg.color}"><span class="tl-icon">${cfg.icon}</span>${esc(typeLabel)}</div>
      <div class="tl-info">
        <div class="tl-city">${cityHtml}</div>
        ${noteHtml ? `<div class="tl-note">${noteHtml}</div>` : ''}
      </div>
    </div>`;

    i++;
  }

  const content = document.getElementById('timeline-content');
  content.innerHTML = html;

  content.querySelectorAll('.tl-row.tl-link').forEach(row => {
    row.addEventListener('click', () => {
      const s = SHOWS.find(s => s.n === +row.dataset.stopn);
      if (s) openCity(s);
    });
  });

  const nowEl = content.querySelector('.tl-row.tl-now');
  if (nowEl) setTimeout(() => nowEl.scrollIntoView({behavior:'smooth', block:'center'}), 120);
}

// Timeline: Desktop = immer sichtbar als Sidebar. Mobile = Bottom-Drawer.
const tlHandle = document.getElementById('tl-handle');
let tlExpanded = false;

function expandTimeline() {
  tlExpanded = true;
  document.getElementById('timeline-view').classList.add('tl-expanded');
  tlHandle.setAttribute('aria-expanded', 'true');
  document.getElementById('tl-handle-label').textContent = 'CLOSE';
}
function collapseTimeline() {
  tlExpanded = false;
  document.getElementById('timeline-view').classList.remove('tl-expanded');
  tlHandle.setAttribute('aria-expanded', 'false');
  document.getElementById('tl-handle-label').textContent = 'TIMELINE';
}

tlHandle.addEventListener('click', () => tlExpanded ? collapseTimeline() : expandTimeline());
tlHandle.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tlExpanded ? collapseTimeline() : expandTimeline(); }
});

// Mobile: #timeline-btn (auf Desktop hidden) expandiert den Drawer
document.getElementById('timeline-btn').addEventListener('click', () =>
  tlExpanded ? collapseTimeline() : expandTimeline()
);

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
loadFavs();
updateFavCount();
renderTimeline();
requestAnimationFrame(() => map.invalidateSize());

// Auto-play the route once on every load, then settle to the static map
if (!reducedMotion) {
  map.whenReady(() => setTimeout(() => { if (routeMode === 'static') setAnimate(false); }, 800));
}
